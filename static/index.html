<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System · Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#060b1f;--tx:#e6efff;--mu:#7f93bd;--ac:#3b82ff;--hi:#7fb4ff;--ok:#38d6ff;--bad:#ff5d7a;--bd:rgba(70,140,255,.35);--gl:0 0 16px rgba(47,107,255,.2),inset 0 0 22px rgba(47,107,255,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 50% -10%,#14357a 0%,#080f2a 50%,#050914 100%) fixed;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:760px;margin:0 auto;padding:12px}
.card,.tile{background:linear-gradient(160deg,rgba(18,42,98,.65),rgba(7,15,40,.8));border:1px solid var(--bd);border-radius:0;padding:14px;margin:0 0 12px;box-shadow:var(--gl);color:var(--tx)}
h3,h2{margin:0 0 8px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--hi);text-shadow:0 0 10px rgba(80,150,255,.7)}
.mu,small{color:var(--mu)}small{display:block;font-size:12px}
.big{font-size:44px;font-weight:800;line-height:1;text-shadow:0 0 16px rgba(80,150,255,.8)}
.bar{position:relative;height:10px;background:rgba(80,130,230,.18);border-radius:0;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#38d6ff);border-radius:0;box-shadow:0 0 10px #38d6ff;transition:width .25s}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.7}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(70,140,255,.15)}
.row:last-child{border-bottom:0}
label.row{cursor:pointer;justify-content:flex-start}label.row span{flex:1}
input[type=checkbox]{width:22px;height:22px;accent-color:#38d6ff}
.dn{text-decoration:line-through;color:var(--mu)}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{background:rgba(5,12,35,.7);border:1px solid var(--bd);border-radius:0;padding:8px;min-width:0;width:100%}
textarea{min-height:110px;resize:vertical;margin:4px 0 10px}
.row input:not([type=checkbox]){width:auto}
button{background:rgba(20,45,105,.6);border:1px solid var(--bd);border-radius:0;padding:8px 12px;cursor:pointer}
button.pri,.on{background:var(--ac)!important;border-color:var(--ac)!important;color:#fff!important}
.st{display:flex;gap:8px}.st button{flex:1}
.hd{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}.hd b{font-size:17px}
.seg,.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.seg button{flex:1;text-transform:capitalize}.chips button{flex:1;padding:8px 4px}
.tiles{display:grid;gap:12px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{text-align:left;width:100%;margin:0}
.tile .ic{font-size:26px}.tile .pc{font-size:34px;font-weight:800;text-shadow:0 0 14px rgba(80,150,255,.8)}
.lock{opacity:.55;border-style:dashed}
.lv{font-size:26px;font-weight:800;letter-spacing:.1em;text-shadow:0 0 14px rgba(80,150,255,.9)}
.cols{display:flex;gap:6px;align-items:flex-end}.col{flex:1;text-align:center}
.cb{height:110px;background:rgba(80,130,230,.15);border-radius:0;display:flex;align-items:flex-end;overflow:hidden}.cb i{display:block;width:100%;background:linear-gradient(0deg,#2563eb,#38d6ff)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.grid b{font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal div{aspect-ratio:1;border-radius:0;font-size:12px;display:flex;align-items:center;justify-content:center;background:rgba(80,130,230,.15)}.cal .h{background:none;aspect-ratio:auto;color:var(--mu)}
.in{color:var(--ok)}.out{color:var(--bad)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f .w{grid-column:1/3}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(6,11,31,.92);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;padding:10px 4px;color:var(--mu);font-size:14px}
nav button.on{background:none!important;color:var(--ok)!important;font-weight:700;text-shadow:0 0 10px #38d6ff}
.card,.tile{position:relative;border:1px solid rgba(80,150,255,.55)}
.card::before,.tile::before{content:"";position:absolute;top:-1px;left:-1px;width:12px;height:12px;border-top:2px solid var(--ok);border-left:2px solid var(--ok);pointer-events:none}
.card::after,.tile::after{content:"";position:absolute;bottom:-1px;right:-1px;width:12px;height:12px;border-bottom:2px solid var(--ok);border-right:2px solid var(--ok);pointer-events:none}
body{font-family:"Rajdhani","Bahnschrift","Arial Narrow",system-ui,sans-serif;font-size:17px;font-weight:500}
h3,h2{font-weight:700;letter-spacing:.18em}
.tiles{grid-template-columns:repeat(3,1fr)!important;gap:8px}
.tile{padding:10px 6px;text-align:center}.tile .ic{font-size:20px}.tile h2{font-size:11px;margin:2px 0 4px}.tile .pc{font-size:20px}
.btn{display:inline-block;background:rgba(20,45,105,.6);border:1px solid var(--bd);padding:8px 12px;cursor:pointer;margin-top:6px}
select{min-width:0}a{text-decoration:none}
nav button{font-size:13px;padding:10px 2px}
</style></head>
<body>
<main id="v"><p class="mu">Loading…</p></main>
<nav id="nav"></nav>
<div id="off" style="display:none;position:fixed;left:0;right:0;top:0;background:#7a1730;color:#fff;text-align:center;padding:4px;font-size:13px;z-index:9">Server offline. Changes will save when it is back.</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const shiftMon=(m,n)=>{const[y,mo]=m.split('-').map(Number);return iso(new Date(y,mo-1+n,1)).slice(0,7)};
const fmt=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const uid0=()=>Math.random().toString(36).slice(2,8);
const DAYS=['sun','mon','tue','wed','thu','fri','sat'],ORDER=['mon','tue','wed','thu','fri','sat','sun'],DN={sun:'Sunday',mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday'};
let cur=iso(new Date()),tab='home',rng='week',mon=cur.slice(0,7),store=null,editing=false,editDay='mon';
const S={s:null,days:{},money:{}};
const DEF=()=>{const ex={},fd={};DAYS.forEach(k=>{ex[k]=k=='sun'?['Rest']:['Warm-up','Workout','Stretch'];fd[k]=['Breakfast','Lunch','Snack','Dinner']});return{wake:'05:30',sleep:'22:00',wmin:2,wmax:3,protein:100,budget:0,ex,fd}};
const dk=d=>DAYS[parse(d).getDay()];
const isRest=l=>!l.length||/^rest/i.test(l[0]);
const tm=t=>{const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM')};
const lines=v=>v.split('\n').map(x=>x.trim()).filter(Boolean);

async function init(){try{const r=await fetch('/api/ping');store=r.ok}catch(e){}
  A={upload:async f=>{const r=await fetch('/api/files',{method:'POST',headers:{'Content-Type':f.type||'application/pdf','X-Filename':encodeURIComponent(f.name)},body:f});if(!r.ok)throw new Error('upload');return r.json()},delete:id=>fetch('/api/files/'+id,{method:'DELETE'})}}
async function load(n,def){try{const r=await fetch('/api/doc/'+n);if(r.status==404)return def;if(r.ok)return await r.json()}catch(e){}try{const v=localStorage.getItem('lt:'+n);return v?JSON.parse(v):def}catch(e){return def}}
const timers={},pend={};
function banner(){const b=$('#off');if(b)b.style.display=Object.keys(pend).length?'block':'none'}
function flush(){Object.keys(pend).forEach(n=>{const o=pend[n];fetch('/api/doc/'+n,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(r=>{if(!r.ok)throw 0;if(pend[n]===o)delete pend[n];banner()}).catch(banner)});banner()}
function save(n,o){try{localStorage.setItem('lt:'+n,JSON.stringify(o))}catch(e){}pend[n]=o;clearTimeout(timers[n]);timers[n]=setTimeout(flush,400)}
setInterval(()=>{if(Object.keys(pend).length)flush()},5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){Object.keys(timers).forEach(k=>clearTimeout(timers[k]));flush()}});
const ensureYear=async y=>{if(!S.days[y])S.days[y]=(await load('days-'+y,{days:{}})).days||{}};
const ensureMon=async m=>{if(!S.money[m])S.money[m]=(await load('money-'+m,{items:[]})).items||[]};
const saveDays=y=>save('days-'+y,{days:S.days[y]}),saveMoney=m=>save('money-'+m,{items:S.money[m]}),saveSet=()=>save('health',S.s);

const day=d=>(S.days[d.slice(0,4)]||{})[d]||{};
function setDay(d,p){const y=d.slice(0,4);S.days[y]=S.days[y]||{};const o=S.days[y][d]||{done:{}};if(!o.done)o.done={};S.days[y][d]=Object.assign(o,p);saveDays(y)}
function items(d){const s=S.s,k=dk(d),e=isRest(s.ex[k])?[]:s.ex[k];return[{k:'wake'},{k:'sleep'},...e.map(t=>({k:'e:'+t})),...s.fd[k].map(t=>({k:'f:'+t}))]}
function pct(d){const x=day(d),dn=x.done||{},it=items(d);return Math.round(100*(it.filter(i=>dn[i.k]).length+((x.water||0)>=S.s.wmin?1:0))/(it.length+1))}
function streak(){let d=cur,n=0;if(pct(d)<80)d=addD(d,-1);while(n<400&&pct(d)>=80){n++;d=addD(d,-1)}return n}
function xp(){let x=0;for(const y in S.days)for(const d in S.days[y]){const o=S.days[y][d];x+=(Object.values(o.done||{}).filter(Boolean).length+Object.values(o.sdone||{}).filter(Boolean).length+Object.values(o.pdone||{}).filter(Boolean).length)*10;if((o.water||0)>=S.s.wmin)x+=10}return x}
const sum=(it,t)=>it.filter(i=>i.t==t).reduce((a,i)=>a+i.a,0);

const chk=(k,l,dn)=>`<label class="row"><input type="checkbox" data-act="chk" data-k="${esc(k)}" ${dn[k]?'checked':''}><span class="${dn[k]?'dn':''}">${esc(l)}</span></label>`;
function meter(k,l,u,steps,v,goal,min){const p=Math.min(100,Math.round(100*v/goal));
  return `<div class="row" style="border:0;padding-bottom:0"><span>${l}</span><span class="mu">${+v.toFixed(2)} / ${goal} ${u}</span></div><div class="bar"><i style="width:${p}%"></i>${min?`<b style="left:${100*min/goal}%"></b>`:''}</div><div class="st">${steps.map(s=>`<button data-act="step" data-k="${k}" data-s="${s}">${s>0?'+':'−'} ${Math.abs(s)}</button>`).join('')}</div>`}

function vHome(){const s=S.s,p=pct(cur),x=day(cur),X=xp(),lv=Math.floor(X/200)+1,bal=sum(S.money[cur.slice(0,7)]||[],'in')-sum(S.money[cur.slice(0,7)]||[],'out');
  return `<div class="card"><small>SYSTEM · PLAYER STATUS</small><div class="lv">LEVEL ${lv}</div><div class="bar"><i style="width:${(X%200)/2}%"></i></div><small>${X%200} / 200 XP · ${streak()} day streak</small></div>
  <div class="tiles">
  <button class="tile" data-act="go" data-t="health"><div class="ic">❤️</div><h2>Health</h2><div class="pc">${p}%</div><small>${+(x.water||0).toFixed(1)}/${s.wmax} L</small></button>
  <button class="tile" data-act="go" data-t="college">${colTile()}</button>
  <button class="tile" data-act="go" data-t="self">${selfTile()}</button></div>`}

function vHealth(){if(editing)return vEdit();const x=day(cur),s=S.s,k=dk(cur),dn=x.done||{},p=pct(cur),rest=isRest(s.ex[k]);
  return `<div class="card"><small>HEALTH · DAILY QUEST</small><div class="big">${p}%</div><div class="bar"><i style="width:${p}%"></i></div><small>${DN[k]}</small></div>
  <div class="card"><h3>Routine</h3>${chk('wake','Wake up at '+tm(s.wake),dn)}<div class="row"><span class="mu">Actual wake-up time</span><input type="time" data-act="wake" value="${x.wake||''}"></div>${chk('sleep','Sleep by '+tm(s.sleep),dn)}</div>
  <div class="card"><h3>Water · ${s.wmin} to ${s.wmax} L</h3>${meter('water','Water','L',[-0.25,0.25,0.5],x.water||0,s.wmax,s.wmin)}</div>
  <div class="card"><div class="row" style="border:0;padding:0 0 4px"><h3 style="margin:0">Exercise · ${DN[k]}</h3><button data-act="edit" style="padding:4px 10px">Edit</button></div>${rest?'<p class="mu" style="margin:0">Rest day. Recover and stretch lightly.</p>':s.ex[k].map(t=>chk('e:'+t,t,dn)).join('')}</div>
  <div class="card"><h3>Food · ${DN[k]}</h3>${s.fd[k].map(t=>chk('f:'+t,t,dn)).join('')||'<p class="mu">No meals planned.</p>'}<div style="height:8px"></div>${meter('protein','Protein','g',[-10,10,25],x.protein||0,s.protein)}</div>
  <button class="pri" style="width:100%" data-act="edit">Edit plans</button>`}

function vEdit(){const s=S.s,inp=(l,kk,t,v)=>`<div class="row"><span>${l}</span><input data-act="cfg" data-k="${kk}" type="${t}" ${t=='number'?'step="0.25"':''} value="${v}" style="width:110px"></div>`,
  blk=key=>ORDER.map(d=>`<small style="margin-top:6px">${DN[d]}</small><textarea id="${key}-${d}" style="min-height:${key=='ex'?84:70}px">${esc(s[key][d].join('\n'))}</textarea>`).join('');
  return `<div class="card"><h3>Exercise plan</h3><small>One exercise per line. Write Rest for a rest day.</small>${blk('ex')}</div>
  <div class="card"><h3>Food plan</h3><small>One item per line.</small>${blk('fd')}</div>
  <div class="card"><h3>Routine targets</h3>${inp('Wake up','wake','time',s.wake)}${inp('Sleep','sleep','time',s.sleep)}${inp('Water min (L)','wmin','number',s.wmin)}${inp('Water max (L)','wmax','number',s.wmax)}${inp('Protein (g)','protein','number',s.protein)}</div>
  <button class="pri" style="width:100%" data-act="saveplan">Save &amp; close</button>`}

function vStats(){let h=`<div class="seg">${['week','month','year'].map(r=>`<button data-act="rng" data-r="${r}" class="${rng==r?'on':''}">${r}</button>`).join('')}</div>`;
  if(rng=='week'){const ds=[...Array(7)].map((_,i)=>addD(cur,i-6)),a=k=>Math.round(ds.reduce((t,d)=>t+(day(d)[k]||0),0)/7*10)/10;
    h+=`<div class="card"><h3>Last 7 days</h3><div class="cols">${ds.map(d=>`<div class="col"><div class="cb"><i style="height:${pct(d)}%"></i></div><small>${parse(d).toLocaleDateString('en',{weekday:'short'})}</small><small>${pct(d)}%</small></div>`).join('')}</div></div>
    <div class="card grid"><div><b>${Math.round(ds.reduce((t,d)=>t+pct(d),0)/7)}%</b><small>avg score</small></div><div><b>${a('water')}</b><small>avg water L</small></div><div><b>${a('protein')}</b><small>avg protein g</small></div><div><b>${streak()}</b><small>day streak</small></div></div>`;
  }else if(rng=='month'){const m=cur.slice(0,7),f=parse(m+'-01'),n=new Date(f.getFullYear(),f.getMonth()+1,0).getDate(),off=(f.getDay()+6)%7;let c='',t=0;
    ['M','T','W','T','F','S','S'].forEach(w=>c+=`<div class="h">${w}</div>`);for(let i=0;i<off;i++)c+='<div class="h"></div>';
    for(let i=1;i<=n;i++){const d=m+'-'+String(i).padStart(2,'0'),p=pct(d);t+=p;c+=`<div style="background:color-mix(in srgb,#38d6ff ${p}%,rgba(80,130,230,.15))">${i}</div>`}
    h+=`<div class="card"><h3>${f.toLocaleDateString('en',{month:'long',year:'numeric'})}</h3><div class="cal">${c}</div></div><div class="card"><b>${Math.round(t/n)}%</b> <span class="mu">average score · ${streak()} day streak</span></div>`;
  }else{const y=cur.slice(0,4),all=S.days[y]||{};let cols='';
    for(let m=1;m<=12;m++){const k=y+'-'+String(m).padStart(2,'0'),ks=Object.keys(all).filter(d=>d.startsWith(k)),a=ks.length?Math.round(ks.reduce((t,d)=>t+pct(d),0)/ks.length):0;
      cols+=`<div class="col"><div class="cb"><i style="height:${a}%"></i></div><small>${new Date(2000,m-1,1).toLocaleDateString('en',{month:'narrow'})}</small></div>`}
    h+=`<div class="card"><h3>${y} · average score by month</h3><div class="cols" style="gap:3px">${cols}</div></div>`}
  return h}

function vMoney(){const it=S.money[mon]||[],s=S.s,inc=sum(it,'in'),out=sum(it,'out'),cats={};
  it.filter(i=>i.t=='out').forEach(i=>cats[i.c||'other']=(cats[i.c||'other']||0)+i.a);
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]),dd=cur.startsWith(mon)?cur:mon+'-01';
  return `<div class="hd"><button data-act="mnav" data-s="-1">‹</button><b>${parse(mon+'-01').toLocaleDateString('en',{month:'long',year:'numeric'})}</b><button data-act="mnav" data-s="1">›</button></div>
  <div class="card grid" style="grid-template-columns:repeat(3,1fr)"><div><b class="in">${fmt(inc)}</b><small>in</small></div><div><b class="out">${fmt(out)}</b><small>spent</small></div><div><b>${fmt(inc-out)}</b><small>balance</small></div></div>
  <div class="card"><div class="row" style="border:0;padding-top:0"><span>Monthly budget (₹)</span><input data-act="cfg" data-k="budget" type="number" value="${s.budget}" style="width:110px"></div>${s.budget>0?`<div class="bar"><i style="width:${Math.min(100,Math.round(100*out/s.budget))}%;${out>s.budget?'background:var(--bad)':''}"></i></div><small>${fmt(out)} of ${fmt(s.budget)}</small>`:''}</div>
  <div class="card"><h3>Add entry</h3><div class="f"><select id="tt"><option value="out">Spent</option><option value="in">Received</option></select><input id="ta" type="number" inputmode="decimal" placeholder="Amount"><input id="tc" list="cl" placeholder="Category"><input id="td" type="date" value="${dd}"><input id="tn" class="w" placeholder="Note (optional)"><button class="pri w" data-act="addtx">Add</button></div>
  <datalist id="cl"><option>Food</option><option>Travel</option><option>Bills</option><option>Study</option><option>Shopping</option><option>Salary</option></datalist></div>
  ${cl.length?`<div class="card"><h3>Where it went</h3>${cl.map(([k,v])=>`<div class="row" style="border:0;padding:4px 0"><span>${esc(k)}</span><span class="mu">${fmt(v)}</span></div>`).join('')}</div>`:''}
  <div class="card"><h3>Entries</h3>${[...it].sort((a,b)=>b.d.localeCompare(a.d)).map(i=>`<div class="row"><span><b class="${i.t}">${i.t=='in'?'+':'−'}${fmt(i.a)}</b> ${esc(i.c||'')}<small>${i.d} ${esc(i.n||'')}</small></span><button data-act="deltx" data-id="${i.id}">✕</button></div>`).join('')||'<p class="mu">Nothing yet.</p>'}</div>
  <p class="mu" style="font-size:13px">${store?'Saved to your local server.':'Server not reachable. Saved in this browser only.'}</p>`}

/* ---- college ---- */
let cv='main',selSem=null,selSub=null,armed=null,A=null,busy='',err='';
const CDEF=()=>({sems:[],subs:[],plan:{}});
const saveCol=()=>save('college',S.c);
const sub=id=>S.c.subs.find(x=>x.id==id);
const semName=id=>(S.c.sems.find(x=>x.id==id)||{}).name||'';
const arm=k=>{if(armed==k){armed=null;return true}armed=k;return false};
const sylP=u=>u.ch.length?Math.round(100*u.ch.filter(c=>c.d).length/u.ch.length):0;
const asgLeft=u=>u.as.filter(a=>!a.d).length;
const BL=['Regular','Backlog pending','Backlog cleared'];
function planSum(d){const pl=S.c.plan[dk(d)]||[],sd=day(d).sdone||{};return{t:pl.reduce((a,i)=>a+i.h,0),d:pl.filter(i=>sd[i.s]).reduce((a,i)=>a+i.h,0),pl,sd}}
function colTile(){const p=planSum(cur);return `<div class="ic">📚</div><h2>College</h2><div class="pc">${p.t?p.d+'/'+p.t+'h':'—'}</div><small>${p.t?'study today':'set plan'}</small>`}
const hdr=(v,t)=>`<div class="hd"><button data-act="cgo" data-v="${v}">‹ Back</button><b>${t}</b><span style="width:60px"></span></div>`;
function vCollege(){return({main:cMain,sem:cSem,sub:cSub,plan:cPlan}[cv]||cMain)()}
function cMain(){const c=S.c,p=planSum(cur),left=c.subs.filter(u=>u.bl!=2&&asgLeft(u)>0),bls=c.subs.filter(u=>u.bl==1);
  return `<div class="card"><small>COLLEGE · STUDY QUEST</small><div class="big">${p.d}/${p.t}h</div><div class="bar"><i style="width:${p.t?Math.round(100*p.d/p.t):0}%"></i></div>
  ${p.pl.map(i=>{const u=sub(i.s);return u?`<label class="row"><input type="checkbox" data-act="sd" data-s="${u.id}" ${p.sd[i.s]?'checked':''}><span class="${p.sd[i.s]?'dn':''}">${esc(u.n)} · ${i.h}h</span></label>`:''}).join('')||'<p class="mu" style="margin:0">No study planned today.</p>'}
  <button data-act="cgo" data-v="plan" style="width:100%;margin-top:8px">Edit weekly study plan</button></div>
  <div class="card"><h3>Assignments left</h3>${left.map(u=>`<div class="row"><span>${esc(u.n)}<small>${esc(semName(u.sem))}</small></span><button data-act="osub" data-id="${u.id}">${asgLeft(u)} left</button></div>`).join('')||'<p class="mu" style="margin:0">Nothing pending.</p>'}</div>
  <div class="card"><h3>Backlogs to pass</h3>${bls.map(u=>`<div class="row"><span>${esc(u.n)}<small>${esc(semName(u.sem))} · syllabus ${sylP(u)}%</small></span><button data-act="osub" data-id="${u.id}">Open</button></div>`).join('')||'<p class="mu" style="margin:0">No backlogs. Mark a subject as Backlog pending inside it.</p>'}</div>
  <div class="card"><h3>Semesters</h3>${c.sems.map(m=>`<div class="row"><button data-act="osem" data-id="${m.id}" style="flex:1;text-align:left">${esc(m.name)}</button><small>${c.subs.filter(u=>u.sem==m.id).length} subjects</small></div>`).join('')}<div class="row"><input id="ns" placeholder="Add semester (e.g. Sem 5)" style="flex:1"><button class="pri" data-act="addsem">Add</button></div></div>`}
function cSem(){const m=S.c.sems.find(x=>x.id==selSem);if(!m){cv='main';return cMain()}
  const us=S.c.subs.filter(u=>u.sem==m.id);
  return hdr('main',esc(m.name))+`<div class="card"><h3>Subjects</h3>${us.map(u=>`<div class="row"><button data-act="osub" data-id="${u.id}" style="flex:1;text-align:left">${esc(u.n)}${u.bl==1?' ⚠':''}</button><small style="text-align:right">Syllabus ${sylP(u)}%<br>${asgLeft(u)} assignments left</small></div>`).join('')||'<p class="mu" style="margin:0">No subjects yet.</p>'}
  <div class="row"><input id="nsub" placeholder="Add subject" style="flex:1"><button class="pri" data-act="addsub">Add</button></div></div>
  <button data-act="delsem" style="width:100%">${armed=='sem'+m.id?'Tap again to delete this semester':'Delete semester'}</button>`}
function cSub(){const u=sub(selSub);if(!u){cv='main';return cMain()}
  const lst=(w,l,ph,i)=>`<div class="card"><h3>${l}</h3>${w=='ch'?`<div class="bar"><i style="width:${sylP(u)}%"></i></div>`:''}${u[w].map(x=>`<div class="row"><label style="display:flex;gap:10px;align-items:center;flex:1"><input type="checkbox" data-act="tg" data-w="${w}" data-id="${x.id}" ${x.d?'checked':''}><span class="${x.d?'dn':''}">${esc(x.t)}</span></label><button data-act="del" data-w="${w}" data-id="${x.id}">✕</button></div>`).join('')}<div class="row"><input id="${i}" placeholder="${ph}" style="flex:1"><button class="pri" data-act="add" data-w="${w}" data-i="${i}">Add</button></div></div>`;
  const fl=k=>u.fl.filter(f=>f.k==k).map(f=>`<div class="row"><a href="/files/${f.a}" target="_blank" rel="noopener" style="color:var(--ok);flex:1;word-break:break-all">📄 ${esc(f.n)}</a><button data-act="delf" data-id="${f.id}">${armed=='f'+f.id?'Sure?':'✕'}</button></div>`).join('');
  const up=(k,l)=>A?`<label class="btn">${busy==k?'Uploading…':'+ Upload '+l}<input type="file" accept="application/pdf,image/png,image/jpeg" hidden data-act="upl" data-k="${k}"></label>`:'<small>PDF storage is not available in this view.</small>';
  return hdr('sem',esc(u.n))+`<div class="card"><h3>${esc(semName(u.sem))} · status</h3><div class="chips">${BL.map((l,i)=>`<button data-act="bl" data-v="${i}" class="${u.bl==i?'on':''}">${l}</button>`).join('')}</div></div>
  ${lst('ch','Syllabus · '+sylP(u)+'%','Add chapter / topic','nch')}${lst('as','Assignments · '+asgLeft(u)+' left','Add assignment','nas')}
  <div class="card"><h3>Syllabus PDFs</h3>${fl('syl')}${up('syl','syllabus PDF')}</div>
  <div class="card"><h3>PYQ papers</h3>${fl('pyq')}${up('pyq','PYQ PDF')}${err?`<small class="out">${err}</small>`:''}</div>
  <button data-act="delsub" style="width:100%">${armed=='sub'+u.id?'Tap again to delete this subject':'Delete subject'}</button>`}
function cPlan(){const c=S.c;
  return hdr('main','Weekly study plan')+(c.subs.length?'':'<p class="mu">Add a semester and subjects first, then plan them here.</p>')+ORDER.map(d=>{const pl=c.plan[d]||[];
    return `<div class="card"><h3>${DN[d]} · ${pl.reduce((a,i)=>a+i.h,0)}h</h3>${pl.map((i,n)=>`<div class="row"><select data-act="pset" data-d="${d}" data-i="${n}" data-f="s" style="flex:1">${c.subs.map(u=>`<option value="${u.id}" ${u.id==i.s?'selected':''}>${esc(u.n)}</option>`).join('')}</select><input type="number" step="0.5" min="0" value="${i.h}" data-act="pset" data-d="${d}" data-i="${n}" data-f="h" style="width:70px"><button data-act="pdel" data-d="${d}" data-i="${n}">✕</button></div>`).join('')}<button data-act="padd" data-d="${d}" style="width:100%;margin-top:6px">+ Add subject</button></div>`}).join('')}
function colClick(b,a){const c=S.c,d=b.dataset;if(!/^del(f|sub|sem|tp)$/.test(a))armed=null;
  if(a=='cgo'){cv=d.v;err=''}
  else if(a=='osub'){const u=sub(d.id);selSub=u.id;selSem=u.sem;cv='sub';err=''}
  else if(a=='osem'){selSem=d.id;cv='sem'}
  else if(a=='addsem'){const n=$('#ns').value.trim();if(n){c.sems.push({id:uid0(),name:n});saveCol()}}
  else if(a=='addsub'){const n=$('#nsub').value.trim();if(n){c.subs.push({id:uid0(),sem:selSem,n,bl:0,ch:[],as:[],fl:[]});saveCol()}}
  else if(a=='add'){const u=sub(selSub),t=$('#'+d.i).value.trim();if(t){u[d.w].push({id:uid0(),t,d:false});saveCol()}}
  else if(a=='del'){const u=sub(selSub);u[d.w]=u[d.w].filter(x=>x.id!=d.id);saveCol()}
  else if(a=='bl'){sub(selSub).bl=+d.v;saveCol()}
  else if(a=='padd'){if(c.subs.length){(c.plan[d.d]=c.plan[d.d]||[]).push({s:c.subs[0].id,h:1});saveCol()}}
  else if(a=='pdel'){c.plan[d.d].splice(+d.i,1);saveCol()}
  else if(a=='delf'){if(arm('f'+d.id)){const u=sub(selSub),f=u.fl.find(x=>x.id==d.id);u.fl=u.fl.filter(x=>x.id!=d.id);saveCol();if(A&&f)A.delete(f.a).catch(()=>{})}}
  else if(a=='delsub'){if(arm('sub'+selSub)){const u=sub(selSub);c.subs=c.subs.filter(x=>x.id!=u.id);Object.keys(c.plan).forEach(k=>c.plan[k]=c.plan[k].filter(i=>i.s!=u.id));saveCol();if(A)u.fl.forEach(f=>A.delete(f.a).catch(()=>{}));cv='sem'}}
  else if(a=='delsem'){if(arm('sem'+selSem)){const us=c.subs.filter(u=>u.sem==selSem),ids=us.map(u=>u.id);if(A)us.forEach(u=>u.fl.forEach(f=>A.delete(f.a).catch(()=>{})));c.subs=c.subs.filter(u=>u.sem!=selSem);c.sems=c.sems.filter(m=>m.id!=selSem);Object.keys(c.plan).forEach(k=>c.plan[k]=c.plan[k].filter(i=>!ids.includes(i.s)));saveCol();cv='main'}}
  else return false;
  return true}
function colChange(t,a){const d=t.dataset;
  if(a=='sd'){const sd=Object.assign({},day(cur).sdone||{});sd[d.s]=t.checked;setDay(cur,{sdone:sd})}
  else if(a=='tg'){sub(selSub)[d.w].find(x=>x.id==d.id).d=t.checked;saveCol()}
  else if(a=='pset'){const i=S.c.plan[d.d][+d.i];i[d.f]=d.f=='h'?Math.max(0,parseFloat(t.value)||0):t.value;saveCol()}
  else if(a=='upl'){const f=t.files[0],k=d.k;t.value='';if(!f||!A)return true;err='';busy=k;A.upload(f).then(r=>{sub(selSub).fl.push({id:uid0(),n:f.name,k,a:r.id});saveCol()}).catch(()=>{err='Upload failed. Use a PDF, PNG or JPG up to 50 MB.'}).finally(()=>{busy='';render()})}
  else return false;
  return true}

/* ---- self (topics: schedule, resources, notes) ---- */
let sv='main',selTop=null;
const SDEF=()=>({topics:[{id:'t1',n:'Book reading'},{id:'t2',n:'Coding'},{id:'t3',n:'Game dev (Unity)'},{id:'t4',n:'Android Studio'},{id:'t5',n:'Java, Python, C, C++ with DSA'}].map(x=>Object.assign(x,{sch:{},res:[],notes:[]}))});
const saveSelf=()=>save('self',S.f);
const tp=id=>S.f.topics.find(x=>x.id==id);
const hrsWeek=x=>Object.values(x.sch||{}).reduce((a,v)=>a+(v.h||0),0);
function selfPlan(d){const dn=day(d).pdone||{},k=dk(d),it=S.f.topics.filter(x=>((x.sch||{})[k]||{}).h>0).map(x=>({x,h:x.sch[k].h,at:x.sch[k].at||''})).sort((a,b)=>(a.at||'99').localeCompare(b.at||'99'));
  return{it,dn,t:it.reduce((a,i)=>a+i.h,0),d:it.filter(i=>dn[i.x.id]).reduce((a,i)=>a+i.h,0)}}
function selfTile(){const p=selfPlan(cur);return `<div class="ic">🧠</div><h2>Self</h2><div class="pc">${p.t?p.d+'/'+p.t+'h':'—'}</div><small>${p.t?'growth today':'set plan'}</small>`}
function vSelf(){return(sv=='topic'?sTop:sMain)()}
function sMain(){const f=S.f,p=selfPlan(cur);
  return `<div class="card"><small>SELF · GROWTH QUEST</small><div class="big">${p.d}/${p.t}h</div><div class="bar"><i style="width:${p.t?Math.round(100*p.d/p.t):0}%"></i></div>
  ${p.it.map(i=>`<label class="row"><input type="checkbox" data-act="spd" data-id="${i.x.id}" ${p.dn[i.x.id]?'checked':''}><span class="${p.dn[i.x.id]?'dn':''}">${esc(i.x.n)} · ${i.h}h${i.at?' · '+tm(i.at):''}</span></label>`).join('')||'<p class="mu" style="margin:0">Nothing scheduled today.</p>'}</div>
  <button class="pri" style="width:100%;margin-bottom:12px" data-act="go" data-t="money">💰 Money tracker</button>
  <div class="card"><h3>Topics</h3>${f.topics.map(x=>`<div class="row"><button data-act="otp" data-id="${x.id}" style="flex:1;text-align:left">${esc(x.n)}</button><small style="text-align:right">${hrsWeek(x)}h / week<br>${(x.notes||[]).filter(n=>!n.d).length} to cover</small></div>`).join('')}<div class="row"><input id="ntp" placeholder="Add topic" style="flex:1"><button class="pri" data-act="addtp">Add</button></div></div>`}
function sTop(){const x=tp(selTop);if(!x){sv='main';return sMain()}
  x.sch=x.sch||{};x.res=x.res||[];x.notes=x.notes||[];
  return `<div class="hd"><button data-act="sgo">‹ Back</button><b>${esc(x.n)}</b><span style="width:60px"></span></div>
  <div class="card"><h3>Schedule · ${hrsWeek(x)}h / week</h3>${ORDER.map(d=>{const v=x.sch[d]||{};return `<div class="row"><span style="width:44px">${DN[d].slice(0,3)}</span><input type="number" step="0.5" min="0" placeholder="hrs" value="${v.h||''}" data-act="ssch" data-d="${d}" data-f="h" style="width:70px"><input type="time" value="${v.at||''}" data-act="ssch" data-d="${d}" data-f="at"></div>`}).join('')}<small>Hours per day (empty = off) and start time.</small></div>
  <div class="card"><h3>Resources</h3>${x.res.map(r=>`<div class="row"><span style="flex:1;word-break:break-word">${r.u?`<a href="${esc(r.u)}" target="_blank" rel="noopener" style="color:var(--ok)">${esc(r.t)}</a>`:esc(r.t)}</span><button data-act="delres" data-id="${r.id}">✕</button></div>`).join('')||'<p class="mu" style="margin:0">No resources yet.</p>'}
  <div class="f" style="margin-top:8px"><input id="rt" placeholder="Name (book, course, video)"><input id="ru" placeholder="Link (optional)"><button class="pri w" data-act="addres">Add resource</button></div></div>
  <div class="card"><h3>Notes · what I missed</h3>${[...x.notes].reverse().map(n=>`<div class="row"><label style="display:flex;gap:10px;align-items:flex-start;flex:1"><input type="checkbox" data-act="ntg" data-id="${n.id}" ${n.d?'checked':''}><span class="${n.d?'dn':''}" style="white-space:pre-wrap">${esc(n.t)}<small>${n.dt||''}</small></span></label><button data-act="delnote" data-id="${n.id}">✕</button></div>`).join('')||'<p class="mu" style="margin:0">Nothing missed yet.</p>'}
  <textarea id="nn" placeholder="What did you miss or need to revise?"></textarea><button class="pri" style="width:100%" data-act="addnote">Add note</button></div>
  <button data-act="deltp" style="width:100%">${armed=='tp'+x.id?'Tap again to delete this topic':'Delete topic'}</button>`}
function selfClick(b,a){const f=S.f,d=b.dataset;
  if(a=='sgo')sv='main';
  else if(a=='otp'){selTop=d.id;sv='topic'}
  else if(a=='addtp'){const n=$('#ntp').value.trim();if(n){f.topics.push({id:uid0(),n,sch:{},res:[],notes:[]});saveSelf()}}
  else if(a=='addres'){const x=tp(selTop),t=$('#rt').value.trim();let u=$('#ru').value.trim();if(t){if(u&&!/^https?:\/\//i.test(u))u='https://'+u;x.res.push({id:uid0(),t,u});saveSelf()}}
  else if(a=='delres'){const x=tp(selTop);x.res=x.res.filter(r=>r.id!=d.id);saveSelf()}
  else if(a=='addnote'){const x=tp(selTop),t=$('#nn').value.trim();if(t){x.notes.push({id:uid0(),t,d:false,dt:iso(new Date())});saveSelf()}}
  else if(a=='delnote'){const x=tp(selTop);x.notes=x.notes.filter(n=>n.id!=d.id);saveSelf()}
  else if(a=='deltp'){if(arm('tp'+selTop)){f.topics=f.topics.filter(x=>x.id!=selTop);saveSelf();sv='main'}}
  else return false;
  return true}
function selfChange(t,a){const d=t.dataset;
  if(a=='ssch'){const x=tp(selTop);x.sch=x.sch||{};const v=x.sch[d.d]=x.sch[d.d]||{h:0,at:''};if(d.f=='h')v.h=Math.max(0,parseFloat(t.value)||0);else v.at=t.value;saveSelf()}
  else if(a=='spd'){const dn=Object.assign({},day(cur).pdone||{});dn[d.id]=t.checked;setDay(cur,{pdone:dn})}
  else if(a=='ntg'){tp(selTop).notes.find(n=>n.id==d.id).d=t.checked;saveSelf()}
  else return false;
  return true}

async function render(){
  const y=+cur.slice(0,4);await ensureYear(String(y));await ensureYear(String(y-1));await ensureMon(cur.slice(0,7));await ensureMon(mon);
  const nm={home:'Home',health:'Health',college:'College',self:'Self',stats:'Stats',money:'Money'};
  $('#nav').innerHTML=Object.keys(nm).map(k=>`<button data-act="go" data-t="${k}" class="${tab==k?'on':''}">${nm[k]}</button>`).join('');
  const hd=(tab=='health'||tab=='stats'||(tab=='college'&&cv=='main')||(tab=='self'&&sv=='main'))&&!editing?`<div class="hd"><button data-act="dnav" data-s="-1">‹</button><b>${cur==iso(new Date())?'Today · ':''}${parse(cur).toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'})}</b><button data-act="dnav" data-s="1">›</button></div>`:'';
  $('#v').innerHTML=hd+({home:vHome,health:vHealth,college:vCollege,self:vSelf,stats:vStats,money:vMoney}[tab])();
}
function capture(){if(editing&&$('#ex-mon')){DAYS.forEach(d=>{S.s.ex[d]=lines($('#ex-'+d).value);S.s.fd[d]=lines($('#fd-'+d).value)});saveSet()}}

document.addEventListener('click',async e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;const a=b.dataset.act;
  if(a=='go'){capture();editing=false;tab=b.dataset.t}
  else if(a=='dnav')cur=addD(cur,+b.dataset.s);
  else if(a=='rng')rng=b.dataset.r;
  else if(colClick(b,a)){}
  else if(selfClick(b,a)){}
  else if(a=='mnav')mon=shiftMon(mon,+b.dataset.s);
  else if(a=='edit')editing=true;
  else if(a=='eday'){capture();editDay=b.dataset.d}
  else if(a=='saveplan'){capture();editing=false}
  else if(a=='step'){const k=b.dataset.k;setDay(cur,{[k]:Math.max(0,+((day(cur)[k]||0)+ +b.dataset.s).toFixed(2))})}
  else if(a=='addtx'){const amt=parseFloat($('#ta').value),d=$('#td').value||cur;if(!(amt>0))return $('#ta').focus();
    const m=d.slice(0,7);await ensureMon(m);S.money[m].push({id:uid0(),d,t:$('#tt').value,a:amt,c:$('#tc').value.trim(),n:$('#tn').value.trim()});saveMoney(m);mon=m}
  else if(a=='deltx'){S.money[mon]=S.money[mon].filter(i=>i.id!=b.dataset.id);saveMoney(mon)}
  render()});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;if(!a)return;
  if(a=='chk'){const dn=Object.assign({},day(cur).done||{});dn[t.dataset.k]=t.checked;setDay(cur,{done:dn})}
  else if(a=='wake')setDay(cur,{wake:t.value});
  else if(colChange(t,a)){}
  else if(selfChange(t,a)){}
  else if(a=='cfg'){const k=t.dataset.k;S.s[k]=(k=='wake'||k=='sleep')?(t.value||S.s[k]):Math.max(0,parseFloat(t.value)||0);if(S.s.wmax<S.s.wmin)S.s.wmax=S.s.wmin;saveSet();if(k=='budget')return render()}
  if(a!='cfg')render()});

(async()=>{await init();S.s=Object.assign(DEF(),await load('health',{}));S.c=Object.assign(CDEF(),await load('college',{}));S.f=Object.assign(SDEF(),await load('self',{}));render()})();
</script>
</body></html>
